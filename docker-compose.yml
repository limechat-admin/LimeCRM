services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: limecrm
      POSTGRES_PASSWORD: limecrm
      POSTGRES_DB: limecrm
    ports:
      - "127.0.0.1:5444:5432"
    volumes:
      - limecrm-db:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U limecrm"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  limecrm-db:
